<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Compares temperature + humidity from two weather sources as mood dogs, for Meta Ray-Ban Display">
<meta name="mrbd-web-app-capable" content="yes">
<title>Dog Weather Index</title>
<link rel="icon" href="https://github.com/dissdique.png">
<link rel="apple-touch-icon" href="https://github.com/dissdique.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 600px;
    height: 600px;
    overflow: hidden;
    background: #000000; /* pure black = transparent on additive display */
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #e8fbff;
  }

  #app {
    width: 600px;
    height: 600px;
    position: relative;
    box-sizing: border-box;
  }

  .screen {
    width: 600px;
    height: 600px;
    box-sizing: border-box;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .hidden { display: none !important; }

  .logo {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 14px;
    box-shadow: 0 0 14px rgba(0, 212, 255, 0.55);
    border: 2px solid #1a4a5c;
  }

  .header-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .logo-sm {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    border: 2px solid #1a4a5c;
  }

  .title {
    font-size: 22px;
    font-weight: 700;
    color: #7fdcff;
    text-align: center;
  }

  #screen-choice .title { margin-bottom: 0; }

  /* ---- Buttons ---- */
  .focusable {
    transition: all 150ms ease;
    border: 2px solid transparent;
    background: transparent;
    color: #e8fbff;
    font-size: 20px;
    border-radius: 12px;
  }

  .focusable:focus {
    outline: none;
    border-color: #00d4ff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
  }

  .big-btn {
    width: 420px;
    min-height: 88px;
    margin-bottom: 20px;
    font-size: 22px;
  }

  /* ---- Keypad screen ---- */
  #zip-display {
    font-size: 40px;
    letter-spacing: 10px;
    color: #9fe8ff;
    margin-bottom: 6px;
    text-align: center;
  }

  #zip-error {
    font-size: 16px;
    color: #ff8a8a;
    min-height: 20px;
    margin-bottom: 10px;
    text-align: center;
  }

  .keypad-grid {
    display: grid;
    grid-template-columns: repeat(3, 160px);
    grid-auto-rows: 60px;
    gap: 8px;
    margin-bottom: 12px;
  }

  .key {
    width: 160px;
    min-height: 60px;
    font-size: 22px;
  }

  #kBack {
    width: 200px;
    min-height: 50px;
    font-size: 17px;
  }

  /* ---- Status / result screen ---- */
  #overall-status {
    font-size: 18px;
    letter-spacing: 0.5px;
    color: #7fdcff;
    margin-bottom: 10px;
    min-height: 24px;
    text-align: center;
  }

  #location-label {
    font-size: 15px;
    color: #6fe0ff;
    font-weight: 600;
    margin-bottom: 10px;
    text-align: center;
    min-height: 18px;
  }

  #compare-row {
    display: flex;
    gap: 22px;
    margin-bottom: 12px;
  }

  .col {
    width: 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .source-label {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
    text-align: center;
    letter-spacing: 0.3px;
  }

  .source-label.om { color: #4fd6ff; }
  .source-label.aw { color: #ff9d4f; }

  .col-dog-wrap {
    width: 150px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .col-sum {
    font-size: 46px;
    font-weight: 700;
    line-height: 1;
    margin: 2px 0 2px 0;
    text-shadow: 0 0 14px currentColor;
    min-height: 50px;
  }

  .col-breakdown {
    font-size: 13px;
    color: #bff2ff;
    text-align: center;
    min-height: 16px;
  }

  .col-state {
    font-size: 13px;
    color: #9fbfca;
    text-align: center;
    padding: 0 4px;
    min-height: 40px;
  }

  #status-buttons {
    display: flex;
    gap: 12px;
  }

  #status-buttons .focusable {
    min-height: 56px;
    padding: 10px 18px;
    font-size: 16px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- Screen 1: choose location method -->
  <div id="screen-choice" class="screen">
    <img class="logo" src="https://github.com/dissdique.png" alt="logo">
    <div class="title" style="margin-bottom: 28px;">Dog Weather Index</div>
    <button class="focusable big-btn" id="btn-mylocation">Use My Location</button>
    <button class="focusable big-btn" id="btn-zip">Enter ZIP Code</button>
  </div>

  <!-- Screen 2: on-screen numeric keypad (no system text input on MRBD) -->
  <div id="screen-keypad" class="screen hidden">
    <div class="header-row">
      <img class="logo-sm" src="https://github.com/dissdique.png" alt="logo">
      <div class="title">Enter ZIP Code</div>
    </div>
    <div id="zip-display">_ _ _ _ _</div>
    <div id="zip-error">&nbsp;</div>
    <div class="keypad-grid">
      <button class="focusable key" id="k1">1</button>
      <button class="focusable key" id="k2">2</button>
      <button class="focusable key" id="k3">3</button>
      <button class="focusable key" id="k4">4</button>
      <button class="focusable key" id="k5">5</button>
      <button class="focusable key" id="k6">6</button>
      <button class="focusable key" id="k7">7</button>
      <button class="focusable key" id="k8">8</button>
      <button class="focusable key" id="k9">9</button>
      <button class="focusable key" id="kDel">⌫</button>
      <button class="focusable key" id="k0">0</button>
      <button class="focusable key" id="kSubmit">✓</button>
    </div>
    <button class="focusable" id="kBack">Back</button>
  </div>

  <!-- Screen 3: two-source comparison result -->
  <div id="screen-status" class="screen hidden">
    <div class="header-row">
      <img class="logo-sm" src="https://github.com/dissdique.png" alt="logo">
      <div class="title">Dog Weather Index</div>
    </div>
    <div id="overall-status">Locating weather…</div>
    <div id="location-label"></div>

    <div id="compare-row">
      <!-- Open-Meteo column -->
      <div class="col">
        <div class="source-label om">Open-Meteo</div>
        <div class="col-dog-wrap" id="dog-om"></div>
        <div class="col-sum" id="sum-om" style="display:none;"></div>
        <div class="col-breakdown" id="breakdown-om"></div>
        <div class="col-state" id="state-om"></div>
      </div>

      <!-- AccuWeather column -->
      <div class="col">
        <div class="source-label aw">AccuWeather</div>
        <div class="col-dog-wrap" id="dog-aw"></div>
        <div class="col-sum" id="sum-aw" style="display:none;"></div>
        <div class="col-breakdown" id="breakdown-aw"></div>
        <div class="col-state" id="state-aw"></div>
      </div>
    </div>

    <div id="status-buttons">
      <button id="retry-btn" class="focusable hidden">Retry</button>
      <button id="change-location-btn" class="focusable hidden">Change Location</button>
    </div>
  </div>

</div>

<script>
(function () {
  // Set this to your deployed Render proxy + "/weather" once you have it,
  // e.g. 'https://your-app-name.onrender.com/weather'. Leave blank to show
  // "not configured" instead of attempting a call.
  var ACCUWEATHER_PROXY_URL = 'https://dogwalk-proxy.onrender.com/weather';

  var screens = {
    choice: document.getElementById('screen-choice'),
    keypad: document.getElementById('screen-keypad'),
    status: document.getElementById('screen-status')
  };
  var currentScreen = 'choice';

  var overallStatusEl = document.getElementById('overall-status');
  var locationLabelEl = document.getElementById('location-label');
  var retryBtn = document.getElementById('retry-btn');
  var changeLocationBtn = document.getElementById('change-location-btn');

  var cols = {
    om: {
      dog: document.getElementById('dog-om'),
      sum: document.getElementById('sum-om'),
      breakdown: document.getElementById('breakdown-om'),
      state: document.getElementById('state-om')
    },
    aw: {
      dog: document.getElementById('dog-aw'),
      sum: document.getElementById('sum-aw'),
      breakdown: document.getElementById('breakdown-aw'),
      state: document.getElementById('state-aw')
    }
  };

  var zipDisplay = document.getElementById('zip-display');
  var zipError = document.getElementById('zip-error');
  var zipDigits = '';

  function showScreen(name) {
    Object.keys(screens).forEach(function (key) {
      if (key === name) {
        screens[key].classList.remove('hidden');
      } else {
        screens[key].classList.add('hidden');
      }
    });
    currentScreen = name;
    var first = screens[name].querySelector('.focusable:not(.hidden):not([disabled])');
    if (first) first.focus();
  }

  function activeScreenEl() {
    return screens[currentScreen];
  }

  // ---- Linear focus navigation (choice screen, status screen) ----
  function moveFocusLinear(direction) {
    var container = activeScreenEl();
    var focusables = Array.from(
      container.querySelectorAll('.focusable:not([disabled]):not(.hidden)')
    );
    if (!focusables.length) return;

    var idx = focusables.indexOf(document.activeElement);
    if (idx === -1) { focusables[0].focus(); return; }

    var next = (direction === 'up' || direction === 'left')
      ? (idx > 0 ? idx - 1 : focusables.length - 1)
      : (idx < focusables.length - 1 ? idx + 1 : 0);

    focusables[next].focus();
  }

  // ---- Grid focus navigation (keypad screen) ----
  var keypadNeighbors = {
    k1:      { up: 'kBack', down: 'k4', left: 'k3', right: 'k2' },
    k2:      { up: 'kBack', down: 'k5', left: 'k1', right: 'k3' },
    k3:      { up: 'kBack', down: 'k6', left: 'k2', right: 'k1' },
    k4:      { up: 'k1',    down: 'k7', left: 'k6', right: 'k5' },
    k5:      { up: 'k2',    down: 'k8', left: 'k4', right: 'k6' },
    k6:      { up: 'k3',    down: 'k9', left: 'k5', right: 'k4' },
    k7:      { up: 'k4',    down: 'kDel', left: 'k9', right: 'k8' },
    k8:      { up: 'k5',    down: 'k0',   left: 'k7', right: 'k9' },
    k9:      { up: 'k6',    down: 'kSubmit', left: 'k8', right: 'k7' },
    kDel:    { up: 'k7',    down: 'kBack', left: 'kSubmit', right: 'k0' },
    k0:      { up: 'k8',    down: 'kBack', left: 'kDel', right: 'kSubmit' },
    kSubmit: { up: 'k9',    down: 'kBack', left: 'k0', right: 'kDel' },
    kBack:   { up: 'kSubmit', down: 'k1', left: 'kBack', right: 'kBack' }
  };

  function moveFocusGrid(direction) {
    var currentId = document.activeElement ? document.activeElement.id : null;
    var map = keypadNeighbors[currentId];
    if (!map) {
      var first = document.getElementById('k1');
      if (first) first.focus();
      return;
    }
    var nextId = map[direction];
    if (nextId) {
      var el = document.getElementById(nextId);
      if (el) el.focus();
    }
  }

  // ---- D-pad Listener ----
  document.addEventListener('keydown', function (e) {
    var dir = null;
    switch (e.key) {
      case 'ArrowUp':    dir = 'up';    break;
      case 'ArrowDown':  dir = 'down';  break;
      case 'ArrowLeft':  dir = 'left';  break;
      case 'ArrowRight': dir = 'right'; break;
      case 'Enter':
        if (document.activeElement && document.activeElement.classList.contains('focusable')) {
          document.activeElement.click();
        }
        e.preventDefault();
        return;
      default:
        return;
    }

    if (currentScreen === 'keypad') {
      moveFocusGrid(dir);
    } else {
      moveFocusLinear(dir);
    }
    e.preventDefault();
  });

  // ---- Dog SVG (rounder, floppy-eared, cartoon style; color = mood) ----
  function dogSVG(mood) {
    var palette = {
      green:  { main: '#33ff8c', ear: '#12a35c', dark: '#0a3d24', tongue: '#ff7a95' },
      yellow: { main: '#ffe23d', ear: '#c9a800', dark: '#4d3f05', tongue: '#ff7a95' },
      red:    { main: '#ff4d4d', ear: '#c22525', dark: '#4d0a0a', tongue: '#ff7a95' }
    };
    var c = palette[mood];
    var mouthGroup;

    if (mood === 'green') {
      // open smiling mouth with tongue out
      mouthGroup =
        '<path d="M 78 118 Q 100 138 122 118" stroke="' + c.dark + '" stroke-width="5" fill="none" stroke-linecap="round"/>' +
        '<path d="M 92 122 Q 100 148 108 122 Z" fill="' + c.tongue + '"/>';
    } else if (mood === 'yellow') {
      // flat / neutral mouth
      mouthGroup =
        '<path d="M 85 124 Q 100 127 115 124" stroke="' + c.dark + '" stroke-width="4" fill="none" stroke-linecap="round"/>';
    } else {
      // frown + tears
      mouthGroup =
        '<path d="M 78 130 Q 100 112 122 130" stroke="' + c.dark + '" stroke-width="5" fill="none" stroke-linecap="round"/>' +
        '<ellipse cx="62" cy="92" rx="6" ry="12" fill="#5ec8ff" opacity="0.9"/>' +
        '<ellipse cx="62" cy="108" rx="4.5" ry="8" fill="#5ec8ff" opacity="0.7"/>' +
        '<ellipse cx="138" cy="92" rx="6" ry="12" fill="#5ec8ff" opacity="0.9"/>' +
        '<ellipse cx="138" cy="108" rx="4.5" ry="8" fill="#5ec8ff" opacity="0.7"/>';
    }

    return (
      '<svg viewBox="0 0 200 200" width="150" height="150" xmlns="http://www.w3.org/2000/svg">' +
        // floppy ears (drawn first, behind head)
        '<path d="M 45 50 C 18 58, 12 108, 38 138 C 52 145, 63 122, 58 92 C 56 72, 51 58, 45 50 Z" fill="' + c.ear + '"/>' +
        '<path d="M 155 50 C 182 58, 188 108, 162 138 C 148 145, 137 122, 142 92 C 144 72, 149 58, 155 50 Z" fill="' + c.ear + '"/>' +
        // head
        '<ellipse cx="100" cy="98" rx="62" ry="58" fill="' + c.main + '"/>' +
        // eyes
        '<circle cx="78" cy="85" r="10.5" fill="' + c.dark + '"/>' +
        '<circle cx="122" cy="85" r="10.5" fill="' + c.dark + '"/>' +
        '<circle cx="74.5" cy="81" r="3.2" fill="#ffffff"/>' +
        '<circle cx="118.5" cy="81" r="3.2" fill="#ffffff"/>' +
        // nose
        '<ellipse cx="100" cy="107" rx="11" ry="8" fill="' + c.dark + '"/>' +
        mouthGroup +
      '</svg>'
    );
  }

  function neutralDogSVG() {
    // gray placeholder dog for "not configured" / no-data states
    return (
      '<svg viewBox="0 0 200 200" width="150" height="150" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M 45 50 C 18 58, 12 108, 38 138 C 52 145, 63 122, 58 92 C 56 72, 51 58, 45 50 Z" fill="#3a3f42"/>' +
        '<path d="M 155 50 C 182 58, 188 108, 162 138 C 148 145, 137 122, 142 92 C 144 72, 149 58, 155 50 Z" fill="#3a3f42"/>' +
        '<ellipse cx="100" cy="98" rx="62" ry="58" fill="#5a6166"/>' +
        '<circle cx="78" cy="85" r="10.5" fill="#20242a"/>' +
        '<circle cx="122" cy="85" r="10.5" fill="#20242a"/>' +
        '<ellipse cx="100" cy="107" rx="11" ry="8" fill="#20242a"/>' +
        '<path d="M 85 124 Q 100 124 115 124" stroke="#20242a" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '</svg>'
    );
  }

  function moodForSum(sum) {
    if (sum < 150) return 'green';
    if (sum < 156) return 'yellow';
    return 'red';
  }

  var moodColor = { green: '#33ff8c', yellow: '#ffe23d', red: '#ff4d4d' };

  function renderColumnResult(key, tempF, humidity) {
    var col = cols[key];
    var sum = Math.round(tempF + humidity);
    var mood = moodForSum(sum);

    col.dog.innerHTML = dogSVG(mood);
    col.sum.style.display = 'block';
    col.sum.style.color = moodColor[mood];
    col.sum.textContent = sum;
    col.breakdown.textContent = Math.round(tempF) + '°F + ' + Math.round(humidity) + '%';
    col.state.textContent = '';
  }

  function renderColumnState(key, message) {
    var col = cols[key];
    col.dog.innerHTML = neutralDogSVG();
    col.sum.style.display = 'none';
    col.sum.textContent = '';
    col.breakdown.textContent = '';
    col.state.textContent = message;
  }

  function resetColumns() {
    renderColumnState('om', 'Loading…');
    renderColumnState('aw', 'Loading…');
  }

  function anyColumnHasData() {
    return cols.om.sum.style.display === 'block' || cols.aw.sum.style.display === 'block';
  }

  // ---- Weather sources ----

  // Free, no key required.
  function getOpenMeteo(lat, lon) {
    var url =
      'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
      '&longitude=' + lon +
      '&current=temperature_2m,relative_humidity_2m' +
      '&temperature_unit=fahrenheit';

    return fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('Open-Meteo request failed');
        return res.json();
      })
      .then(function (data) {
        var cur = data.current;
        if (!cur) throw new Error('No current weather in Open-Meteo response');
        return { tempF: cur.temperature_2m, humidity: cur.relative_humidity_2m };
      });
  }

  // Routed through your own Render proxy (see accuweather-proxy/).
  function getAccuWeather(lat, lon) {
    if (!ACCUWEATHER_PROXY_URL) {
      return Promise.reject(new Error('NOT_CONFIGURED'));
    }
    var url = ACCUWEATHER_PROXY_URL + '?lat=' + lat + '&lon=' + lon;
    return fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('AccuWeather proxy request failed');
        return res.json();
      })
      .then(function (data) {
        if (typeof data.tempF !== 'number' || typeof data.humidity !== 'number') {
          throw new Error('Unexpected AccuWeather proxy response');
        }
        return { tempF: data.tempF, humidity: data.humidity };
      });
  }

  // Reverse-geocodes GPS coords into a human-readable "City, ST" (never rejects)
  function getReverseGeocode(lat, lon) {
    var url =
      'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat +
      '&longitude=' + lon + '&localityLanguage=en';

    return fetch(url)
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        if (!data) return 'Current location';
        var city = data.city || data.locality;
        var regionCode = data.principalSubdivisionCode
          ? data.principalSubdivisionCode.split('-').pop()
          : null;
        var region = regionCode || data.principalSubdivision;
        if (city && region) return city + ', ' + region;
        if (city) return city;
        return 'Current location';
      })
      .catch(function () { return 'Current location'; });
  }

  var lastMethod = null; // 'gps' or { zip: '12345' }

  function loadWeatherForCoords(lat, lon, locationText) {
    overallStatusEl.textContent = 'Fetching weather…';
    resetColumns();

    getOpenMeteo(lat, lon)
      .then(function (w) { renderColumnResult('om', w.tempF, w.humidity); })
      .catch(function () { renderColumnState('om', 'Unavailable. Try again.'); })
      .then(finishIfDone);

    getAccuWeather(lat, lon)
      .then(function (w) { renderColumnResult('aw', w.tempF, w.humidity); })
      .catch(function (err) {
        if (err && err.message === 'NOT_CONFIGURED') {
          renderColumnState('aw', 'Not configured yet.\nSet ACCUWEATHER_PROXY_URL.');
        } else {
          renderColumnState('aw', 'Unavailable. Try again.');
        }
      })
      .then(finishIfDone);

    if (locationText) {
      locationLabelEl.textContent = locationText;
    }

    var settledCount = 0;
    function finishIfDone() {
      settledCount++;
      if (settledCount >= 2) {
        overallStatusEl.textContent = '';
        retryBtn.classList.add('hidden');
        changeLocationBtn.classList.remove('hidden');
        changeLocationBtn.focus();
      }
    }
  }

  function showFatalError(message) {
    overallStatusEl.textContent = message;
    locationLabelEl.textContent = '';
    resetColumns();
    cols.om.state.textContent = '';
    cols.aw.state.textContent = '';
    retryBtn.classList.remove('hidden');
    changeLocationBtn.classList.remove('hidden');
    retryBtn.focus();
  }

  function startWithGPS() {
    lastMethod = 'gps';
    showScreen(
